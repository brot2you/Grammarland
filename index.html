<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="GRAMMARLAND — l’archipel de la grammaire anglaise, de la 6e à la 3e, adossé au programme d’anglais du collège (BO n°22 du 29 mai 2025). Une appli BROT2YOU APP.">
<title>GRAMMARLAND · by BROT2YOU APP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b2a6b;
  --ink-soft: #3a4785;
  --muted: #5a6694;
  --sky: #e4f5ff;
  --paper: #fffdf6;
  --sea: #2db3f0;
  --sea-deep: #158fd2;
  --sun: #ffd23f;
  --coral: #ff5a4f;
  --mint: #22c47e;
  --mint-bg: #e3fbef;
  --ko: #ff8a3d;
  --ko-bg: #fff1e4;
  --grape: #7c5cff;
  --wc: #2db3f0;
  --r: 20px;
  --line: 3px;
  --lift: 0 5px 0 var(--ink);
  --font: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
}
body.large { font-size: 19px; }
body.dys { letter-spacing: .03em; word-spacing: .12em; line-height: 1.75; }
body.dys p, body.dys li, body.dys .opt, body.dys .tile { font-family: "Lexend", sans-serif; }
img { max-width: 100%; }
button { font: inherit; color: inherit; }
a { color: var(--sea-deep); }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; border-radius: 10px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--paper); padding: 8px 14px; border: var(--line) solid var(--ink); border-radius: 12px; z-index: 50; }
.skip:focus { left: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- En-tête ---------- */
.top { background: var(--paper); border-bottom: var(--line) solid var(--ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 21; }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex-wrap: wrap; }
.brandmark {
  font-family: var(--display); font-weight: 800; font-size: 1.75rem; letter-spacing: .01em; line-height: 1;
  background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink);
}
.brandmark span { color: var(--coral); }
.grades { display: flex; gap: 4px; background: var(--sky); border: var(--line) solid var(--ink); border-radius: 999px; padding: 3px; }
.gchip { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; cursor: pointer; min-width: 44px; }
.gchip.on { background: var(--ink); color: #fff; }
.top-stats { display: flex; gap: 6px; margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.pill.xp { background: var(--sun); }
.iconbtn { border: var(--line) solid var(--ink); background: var(--paper); border-radius: 14px; width: 44px; height: 44px; cursor: pointer; font-size: 1.15rem; box-shadow: 0 3px 0 var(--ink); }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.byline { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); font-size: .8rem; font-weight: 600; }
.byline img { height: 46px; width: auto; display: block; }

.nav { background: var(--ink); }
.nav-in { max-width: 1180px; margin: 0 auto; display: flex; gap: 4px; padding: 6px 12px; overflow-x: auto; }
.navbtn { background: transparent; border: 0; color: #fff; padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; display: flex; gap: 6px; align-items: center; position: relative; }
.navbtn:hover { background: rgba(255,255,255,.12); }
.navbtn.on { background: var(--sun); color: var(--ink); }
.badge { background: var(--coral); color: #fff; border-radius: 999px; font-size: .72rem; padding: 1px 7px; margin-left: 2px; }

.tabbar { display: none; }

main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 40px; outline: none; }

/* ---------- Typo ---------- */
.title { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.05; margin: 6px 0 10px; letter-spacing: -.005em; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.15; margin: 26px 0 10px; }
.card .h2:first-child, .welcome .h2 { margin-top: 0; }
.lead { font-size: 1.08rem; max-width: 62ch; color: var(--ink-soft); margin: 0 0 18px; }
.sub { font-family: var(--display); font-weight: 600; font-size: 1.2rem; color: var(--ink-soft); margin: -6px 0 6px; }
.kicker { font-weight: 600; color: var(--muted); font-size: .92rem; margin: 18px 0 6px; }
.small { font-size: .9rem; color: var(--muted); }
.warn { color: #b44a00; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* ---------- Composants ---------- */
.card { background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r); box-shadow: var(--lift); padding: 20px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  background: var(--sea); color: #fff; border: var(--line) solid var(--ink); border-radius: 16px;
  padding: 10px 18px; font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.15;
  box-shadow: 0 4px 0 var(--ink); text-align: left; min-height: 48px; text-decoration: none;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--ink); }
.btn.ghost { background: var(--paper); color: var(--ink); }
.btn.go { background: var(--mint); }
.btn.danger { background: var(--coral); }
.btn.danger-t { color: #b8261d; }
.btn.small { padding: 6px 14px; font-size: 1rem; min-height: 42px; }
.btn.big { font-size: 1.25rem; padding: 12px 22px; flex-direction: column; align-items: flex-start; gap: 0; }
.btn-k { font-family: var(--font); font-weight: 600; font-size: .78rem; opacity: .9; }
.count { background: var(--coral); color: #fff; border-radius: 999px; padding: 0 8px; font-size: .9rem; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--ink-soft); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.row.between { justify-content: space-between; margin-top: 0; }
.row.wrap { flex-wrap: wrap; }
.tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--ink); background: #eef4ff; background: color-mix(in srgb, var(--wc) 22%, white); }
.tag.due { background: var(--sun); }
.tag.ok { background: var(--mint-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: .92rem; min-height: 40px; }
.chip.on { background: var(--ink); color: #fff; }
.chip[style*="--wc"]:not(.on) { box-shadow: inset 0 -4px 0 var(--wc); }
.bar { display: block; height: 14px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--wc, var(--mint)); border-right: 2px solid var(--ink); }
.st { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: .75rem; font-weight: 700; border: 2px solid var(--ink); margin-right: 6px; vertical-align: -5px; flex: none; }
.st-L { background: var(--mint); color: #fff; }
.st-E { background: var(--sun); }
.st-S { background: #fff; }

/* ---------- Carte ---------- */
.hero { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 26px; align-items: center; }
.hero-text .title { font-size: clamp(2rem, 3.6vw, 2.9rem); }
.hero-actions { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.rankline { margin-top: 18px; color: var(--ink-soft); }
.map-wrap { border: var(--line) solid var(--ink); border-radius: 36px; box-shadow: 0 7px 0 var(--ink); overflow: hidden; background: var(--sea); }
.map { display: block; width: 100%; height: auto; }
.sea { fill: var(--sea); }
.wave { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 4; stroke-linecap: round; }
.route { fill: none; stroke: #fff; stroke-width: 7; stroke-dasharray: 2 16; stroke-linecap: round; opacity: .9; }
.isl { cursor: pointer; outline: none; }
.isl > * { transition: transform .18s ease; }
.isl:hover .isl-ring, .isl:focus .isl-ring { stroke: var(--sun); stroke-width: 9; }
.isl-shadow { fill: rgba(10, 50, 110, .28); }
.isl-ring { fill: #fff; stroke: var(--ink); stroke-width: 5; }
.isl-prog { fill: none; stroke-width: 11; stroke-linecap: round; }
.isl-edge { fill: none; stroke: var(--ink); stroke-width: 4; }
.isl-label { stroke: var(--ink); stroke-width: 4; }
.isl-name { font-family: var(--display); font-weight: 800; font-size: 25px; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: var(--ink); stroke-width: 5px; stroke-linejoin: round; }
.isl-count { stroke: var(--ink); stroke-width: 4; }
.isl-count-t, .isl-due-t { font-family: var(--display); font-weight: 800; font-size: 19px; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: var(--ink); stroke-width: 4px; }
.isl-due { fill: var(--coral); stroke: var(--ink); stroke-width: 4; }
.crown { font-size: 40px; text-anchor: middle; }
.pip { filter: drop-shadow(0 3px 0 rgba(27,42,107,.5)); }
.welcome { display: flex; gap: 16px; align-items: flex-start; margin-top: 22px; }
.welcome img { border-radius: 50%; border: var(--line) solid var(--ink); flex: none; }

/* ---------- Île ---------- */
.wbanner { display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: center; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 28px; box-shadow: var(--lift); padding: 20px 24px; border-top: 14px solid var(--wc); }
.wbanner img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--ink); box-shadow: 0 0 0 8px var(--wc); }
.wbanner .title { margin-top: 2px; }
.wbanner .bar { margin-top: 12px; max-width: 420px; }
.gsec { padding-bottom: 6px; border-bottom: 3px dashed color-mix(in srgb, var(--ink) 30%, transparent); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.mcard { background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r); box-shadow: var(--lift); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; border-left: 12px solid var(--wc); }
.mcard h3 { font-family: var(--display); font-weight: 700; font-size: 1.2rem; line-height: 1.15; margin: 0; }
.mcard p { margin: 0; font-size: .93rem; }
.mcard .btn { margin-top: auto; align-self: flex-start; }
.mcard.done { background: linear-gradient(0deg, var(--paper), var(--paper)), var(--paper); }
.mcard.locked { opacity: .7; }
.mcard-top { display: flex; align-items: center; gap: 8px; }
.mnum { width: 30px; height: 30px; border-radius: 50%; background: var(--wc); border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: #fff; text-shadow: 0 1px 0 var(--ink); }
.stars { color: #e5a800; letter-spacing: 1px; font-size: 1.1rem; }
.mbo { font-size: .8rem !important; color: var(--muted); display: flex; align-items: flex-start; }
.boss { display: flex; gap: 18px; align-items: center; margin-top: 28px; border-style: dashed; }
.boss.open, .boss.won { border-style: solid; background: #eef4ff; background: color-mix(in srgb, var(--wc) 14%, var(--paper)); }
.boss-icon { font-size: 3.2rem; width: 84px; height: 84px; border-radius: 50%; background: var(--paper); border: var(--line) solid var(--ink); display: grid; place-items: center; flex: none; }

/* ---------- Fiche mission ---------- */
.brief { max-width: 760px; margin: 0 auto; border-top: 14px solid var(--wc); }
.steps { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-wrap: wrap; gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: 6px; background: var(--sky); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 600; font-size: .9rem; }
.steps li span { width: 28px; height: 28px; display: grid; place-items: center; background: var(--paper); border-radius: 50%; border: 2px solid var(--ink); }
.rule { margin-top: 14px; background: var(--sky); border: 2px dashed var(--ink); border-radius: 14px; padding: 10px 14px; }
.rule summary { cursor: pointer; font-weight: 600; }
.rule p { margin: 10px 0 2px; }

/* ---------- Jeu ---------- */
.play { max-width: 820px; margin: 0 auto; }
.play-top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.play-title { font-family: var(--display); font-weight: 700; font-size: 1.2rem; text-align: center; flex: 1; }
.dots { display: flex; gap: 6px; margin: 12px 0 14px; }
.dots i { flex: 1; height: 10px; border-radius: 999px; background: #fff; border: 2px solid var(--ink); }
.dots i.now { background: var(--sun); }
.dots i.ok { background: var(--mint); }
.dots i.ko { background: var(--ko); }
.round { border-top: 12px solid var(--wc); }
.round-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.kind { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.scene { font-weight: 600; color: var(--ink-soft); margin: 4px 0 10px; }
.q { font-size: 1.05rem; margin: 12px 0; }
.q.big { font-size: 1.35rem; font-weight: 600; }
.gap { display: inline-block; min-width: 3.5em; border-bottom: 4px solid var(--wc); color: transparent; }
.pair { display: grid; gap: 10px; }
.sent { display: flex; align-items: center; gap: 10px; background: var(--sky); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; font-size: 1.15rem; font-weight: 600; }
.sent b { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: #fff; font-family: var(--display); flex: none; }
.sent span { flex: 1; }
.say { background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; flex: none; font-size: 1rem; vertical-align: middle; }
.say:active { transform: translateY(1px); }
.opts { display: grid; gap: 10px; margin-top: 8px; }
.opt { text-align: left; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 16px; padding: 12px 16px; cursor: pointer; font-size: 1.08rem; font-weight: 500; box-shadow: 0 4px 0 var(--ink); min-height: 52px; }
.opt:hover:not(:disabled) { background: #eef4ff; background: color-mix(in srgb, var(--wc) 10%, var(--paper)); }
.opt.picked { background: #eef4ff; background: color-mix(in srgb, var(--wc) 28%, white); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.opt.right { background: var(--mint-bg); border-color: #0e7a4b; box-shadow: 0 4px 0 #0e7a4b; }
.opt.right::before { content: "✓ "; font-weight: 800; color: #0e7a4b; }
.opt.wrong { background: var(--ko-bg); border-color: #b44a00; box-shadow: 0 4px 0 #b44a00; }
.opt.wrong::before { content: "✗ "; font-weight: 800; color: #b44a00; }
.opt:disabled { cursor: default; }
.broken { font-size: 1.3rem; font-weight: 600; text-decoration: underline wavy var(--coral) 2px; text-underline-offset: 6px; margin: 8px 0 14px; }
.line { min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border: var(--line) dashed var(--ink); border-radius: 16px; background: #fff; margin: 10px 0; }
.ph { color: var(--muted); font-size: .95rem; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { background: var(--sun); border: var(--line) solid var(--ink); border-radius: 12px; padding: 8px 14px; font-weight: 600; font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 0 var(--ink); min-height: 46px; min-width: 46px; }
.tile.placed { background: #eef4ff; background: color-mix(in srgb, var(--wc) 30%, white); }
.tile:disabled { opacity: .3; box-shadow: none; cursor: default; }
.tile.placed:disabled { opacity: 1; }
.deck { display: grid; gap: 10px; margin-bottom: 14px; }
.card-s { background: #fff; border: var(--line) solid var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 600; font-size: 1.02rem; }
.card-s.free { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 3px 0 var(--ink); }
.sendto { display: flex; gap: 6px; }
.mini { border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: .82rem; font-weight: 600; min-height: 40px; }
.mini.b0 { background: #e8f0ff; }
.mini.b1 { background: #ffe8f2; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bin { border: var(--line) solid var(--ink); border-radius: 16px; padding: 10px; min-height: 120px; }
.bin0 { background: #e8f0ff; }
.bin1 { background: #ffe8f2; }
.bin h3 { margin: 0 0 8px; font-size: .95rem; font-weight: 700; }
.bin-in { display: flex; flex-direction: column; gap: 6px; }
.card-s.placed { cursor: pointer; text-align: left; }
.card-s.right { background: var(--mint-bg); border-color: #0e7a4b; }
.card-s.wrong { background: var(--ko-bg); border-color: #b44a00; text-decoration: line-through; }
.hint { margin-top: 14px; background: #fff7cf; border: 2px solid var(--ink); border-radius: 14px; padding: 10px 14px; }
.feedback { margin-top: 16px; border: var(--line) solid var(--ink); border-radius: 16px; padding: 14px 16px; outline: none; }
.feedback.ok { background: var(--mint-bg); }
.feedback.ko { background: var(--ko-bg); }
.feedback h3 { font-family: var(--display); font-size: 1.4rem; margin: 0 0 4px; }
.feedback p { margin: 6px 0; }
.feedback .btn { margin-top: 8px; }
.ans { font-size: 1.08rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* ---------- Fin ---------- */
.end { max-width: 720px; margin: 0 auto; text-align: center; }
.end-icon { font-size: 4rem; line-height: 1; }
.end-sub { color: var(--ink-soft); font-size: 1.1rem; }
.bigstars { font-size: 3rem; color: #f2b400; letter-spacing: 6px; text-shadow: 0 3px 0 var(--ink); margin: 6px 0; }
.rulebox { text-align: left; background: var(--sky); border: 2px solid var(--ink); border-radius: 16px; padding: 12px 16px; margin: 12px 0; }
.rulebox h3 { margin: 0 0 4px; font-family: var(--display); }
.end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.end-stats div { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 10px; }
.end-stats b { display: block; font-family: var(--display); font-size: 1.8rem; line-height: 1; }
.end-stats span { font-size: .85rem; color: var(--muted); }
.stamp { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 6px 14px 6px 16px; border: 2px dashed var(--ink); border-radius: 999px; color: var(--muted); font-weight: 600; font-size: .85rem; transform: rotate(-2deg); }
.stamp img { height: 54px; width: auto; }

/* ---------- Mini-jeux ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 12px; }
.mode { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font: inherit; }
.mode:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.mode:disabled { opacity: .55; cursor: not-allowed; }
.mode-i { font-size: 2rem; }
.mode-t { font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.mode-d { font-size: .92rem; color: var(--ink-soft); }

/* ---------- Listes, carnet, programme ---------- */
.cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.cta p { margin: 0; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; background: var(--paper); border: 2px solid var(--ink); border-left: 10px solid var(--wc); border-radius: 12px; padding: 8px 12px; }
.list li span { font-weight: 600; display: flex; align-items: flex-start; }
.list li small { color: var(--muted); }
.nb-tools { margin-bottom: 14px; }
.search input { width: 100%; max-width: 520px; font: inherit; padding: 12px 16px; border: var(--line) solid var(--ink); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--ink); }
.nbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.nb { border-left: 12px solid var(--wc); display: flex; flex-direction: column; gap: 8px; }
.nb h3 { font-family: var(--display); font-size: 1.25rem; margin: 0; line-height: 1.15; }
.nb-top { display: flex; gap: 6px; flex-wrap: wrap; }
.nb-rule { margin: 0; }
.ex { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; background: var(--sky); border-radius: 12px; padding: 8px 10px; font-weight: 600; }
.nb .btn { align-self: flex-start; margin-top: auto; }
.pg-head p { margin: 4px 0; }
.tablewrap { overflow-x: auto; margin: 16px 0; border: var(--line) solid var(--ink); border-radius: var(--r); background: var(--paper); box-shadow: var(--lift); }
.pg { width: 100%; border-collapse: collapse; min-width: 620px; }
.pg caption { text-align: left; padding: 12px 16px 0; font-weight: 700; }
.pg th, .pg td { text-align: left; padding: 10px 14px; border-bottom: 2px solid #e2e6f3; vertical-align: top; }
.pg th { font-size: .85rem; color: var(--muted); }
.nowrap { white-space: nowrap; }
.mchip { display: inline-block; margin: 2px 4px 2px 0; border: 2px solid var(--ink); border-radius: 999px; background: #eef4ff; background: color-mix(in srgb, var(--wc) 18%, white); padding: 3px 10px; font-size: .82rem; font-weight: 600; cursor: pointer; }
.mchip.done::after { content: " ✓"; color: #0e7a4b; }
.legend { margin-top: 22px; }
.legend p { display: flex; align-items: flex-start; }

/* ---------- Progrès ---------- */
.rankcard { display: flex; gap: 18px; align-items: center; }
.rank-i { font-size: 3rem; width: 86px; height: 86px; border-radius: 50%; background: var(--sun); border: var(--line) solid var(--ink); display: grid; place-items: center; flex: none; }
.rankcard > div:last-child { flex: 1; }
.rankcard .kicker { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
.stats .card { padding: 14px; text-align: center; }
.stats b { display: block; font-family: var(--display); font-size: 2rem; line-height: 1; }
.stats span { font-size: .85rem; color: var(--muted); }
.wbars { display: grid; gap: 8px; }
.wbar { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 54px; gap: 12px; align-items: center; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; cursor: pointer; text-align: left; font-weight: 600; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.bdg { background: var(--paper); border: 2px dashed #9aa3c7; border-radius: 16px; padding: 12px; text-align: center; font-weight: 600; font-size: .88rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bdg span { font-size: 2rem; filter: grayscale(1); opacity: .45; }
.bdg small { font-weight: 500; font-size: .75rem; }
.bdg.on { border: var(--line) solid var(--ink); color: var(--ink); background: #fff8d6; box-shadow: 0 4px 0 var(--ink); }
.bdg.on span { filter: none; opacity: 1; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- Aventures ---------- */
.advgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.adv { display: flex; gap: 16px; align-items: flex-start; border-top: 12px solid var(--wc); }
.adv img { border-radius: 50%; border: 3px solid var(--ink); width: 110px; height: 110px; flex: none; }
.adv .h2 { margin: 8px 0 4px; }
.adv-stage { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 0; overflow: hidden; }
.adv-scene { min-height: 190px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 14px; filter: saturate(.55) brightness(.92); transition: filter .4s ease; border-bottom: var(--line) solid var(--ink); }
.adv-scene.lit { filter: none; }
.adv-scene p { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 12px; margin: 0; font-weight: 600; }
.adv-work { padding: 0 20px 20px; }

/* ---------- Pied de page ---------- */
.foot { border-top: var(--line) solid var(--ink); background: var(--paper); }
.foot-in { max-width: 1180px; margin: 0 auto; padding: 18px 16px 24px; display: grid; gap: 6px; font-size: .9rem; color: var(--ink-soft); }
.foot-in p { margin: 0; }
.foot-links { font-size: .85rem; }

/* ---------- Modale, toast, effets ---------- */
.modal { position: fixed; inset: 0; background: rgba(20, 30, 80, .55); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-card { background: var(--paper); border: var(--line) solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); padding: 20px; width: min(520px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; }
.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.toggle input { width: 24px; height: 24px; accent-color: var(--ink); flex: none; margin-top: 2px; }
.toggle small { display: block; color: var(--muted); font-size: .85rem; }
.field { display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 6px 0 8px; }
.field select { font: inherit; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
.toast { visibility: hidden; opacity: 0; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600; z-index: 70; max-width: min(92vw, 520px); transition: transform .25s ease; text-align: center; }
.toast.show { transform: translate(-50%, 0); visibility: visible; opacity: 1; }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 65; overflow: hidden; }
.fx i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; border: 2px solid var(--ink); animation: fall 2.2s ease-in forwards; }
@keyframes fall { to { top: 110%; transform: rotate(540deg) translateX(40px); } }

/* ---------- Contraste renforcé ---------- */
body.contrast { --sky: #ffffff; --muted: #2b3566; --ink-soft: #1b2a6b; }
body.contrast .tag, body.contrast .mchip { background: #fff; }
body.contrast .wave { display: none; }

/* ---------- Animations réduites ---------- */
body.calm *, body.calm *::before, body.calm *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- Mobile ---------- */
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .nav { display: none; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--ink); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tab { background: transparent; border: 0; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: .7rem; font-weight: 600; padding: 4px 2px; border-radius: 12px; cursor: pointer; position: relative; min-height: 48px; }
  .tab span { font-size: 1.25rem; }
  .tab.on { background: var(--sun); color: var(--ink); }
  .tab .badge { position: absolute; top: 0; right: 10%; }
  body { padding-bottom: 76px; }
  .toast { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .top-in { gap: 8px; padding: 8px 12px; }
  .brandmark { font-size: 1.4rem; }
  .byline span { display: none; }
  .byline img { height: 38px; }
  .top-stats .star { display: none; }
  .byline { order: 2; }
  .iconbtn { order: 3; }
  .top-stats { order: 1; margin-left: auto; }
  .grades { order: 5; width: 100%; justify-content: space-between; }
  .gchip { flex: 1; }
  .wbanner { grid-template-columns: 1fr; text-align: left; }
  .wbanner img { width: 110px; height: 110px; }
  .bins { grid-template-columns: 1fr; }
  .wbar { grid-template-columns: 1fr 54px; }
  .wbar .bar { grid-column: 1 / -1; grid-row: 2; }
  .end-stats b { font-size: 1.4rem; }
  .boss { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 420px) {
  .top-stats { display: none; }
  .byline { margin-left: auto; }
  .card { padding: 16px; }
  .btn.big { width: 100%; }
}
main:focus, main:focus-visible { outline: none; }
.legend p.small { display: block; }

/* ---------- Carte illustrée ---------- */
.artmap { position: relative; border: var(--line) solid var(--ink); border-radius: 30px; overflow: hidden; box-shadow: 0 7px 0 var(--ink); background: var(--sea); }
.artmap img { display: block; width: 100%; height: auto; }
.art-m { display: none; }
.spot { position: absolute; background: transparent; border: 0; border-radius: 18px; cursor: pointer; padding: 0; }
.spot:hover { background: rgba(255,255,255,.16); box-shadow: 0 0 0 4px var(--sun); }
.spot:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.pbadge { position: absolute; right: -4px; top: -30%; background: var(--wc); color: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 9px; font-family: var(--display); font-weight: 800; font-size: clamp(.68rem, 1.05vw, 1rem); line-height: 1.5; text-shadow: 0 1px 0 var(--ink); white-space: nowrap; box-shadow: 0 2px 0 var(--ink); }
.nexttag { position: absolute; left: 50%; bottom: -46%; transform: translateX(-50%); background: var(--sun); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; font-weight: 700; font-size: clamp(.65rem, .95vw, .9rem); white-space: nowrap; box-shadow: 0 2px 0 var(--ink); }
.spot.next::before { content: ""; position: absolute; inset: -5px; border: 4px solid #fff; border-radius: 22px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .25; transform: scale(1.06); } }
.livestats { position: absolute; top: 1.1%; left: 52.8%; width: 27%; height: 5.95%; border-radius: 18px; background: #0261c0; border: 2px solid #d4f5ff; color: #fff; display: flex; align-items: center; justify-content: space-evenly; gap: 4px; font-family: var(--display); font-weight: 800; font-size: clamp(.7rem, 1.15vw, 1.2rem); text-shadow: 0 2px 0 #16366c; box-shadow: 0 4px 0 #1b62b1; white-space: nowrap; pointer-events: none; }
.mapbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px; }
.mapbar .rankline { margin: 0; flex-basis: 100%; }
@media (max-width: 620px) {
  .art-d { display: none; }
  .art-m { display: block; }
  .artmap { border-radius: 22px; }
  .pbadge { top: -48px; right: -2px; font-size: .66rem; padding: 0 6px; }
  .nexttag { bottom: auto; top: -36px; left: 2px; transform: none; font-size: .64rem; padding: 0 7px; }
  .mapbar .btn { width: 100%; }
}

n cours à un moment passé.","🔔 La cloche apparaît dans le souvenir !"],["Eli vient de terminer son défi. Le résultat compte maintenant.","Choisis la formulation-bilan.",["Eli played every day.","Eli has finished his challenge.","Eli was finishing yesterday."],1,"HAVE + participe passé permet ici de faire un bilan présent.","🏆 Le trophée apparaît dans la scène !"]]},{"id":"castle","icon":"🏰","title":"Le Château des Phrases","world":"sentences","min":"6e","subtitle":"Construis des passerelles avec les mots.","kind":"build","scenes":[["La porte ne s’ouvre qu’avec une phrase affirmative.","Construis : « Maya lit un livre. »",["Maya","reads","a","book","."],["reads","a","Maya",".","book","read"],"Sujet + verbe + complément. La phrase devient un pont !","🌉 Une passerelle se déploie !"],["Le bibliothécaire veut connaître le lieu.","Construis : « Où habite-t-elle ? »",["Where","does","she","live","?"],["she","live","does","Where","?","lives"],"Avec does, le verbe principal garde sa base verbale.","📚 La bibliothèque s’ouvre !"],["Un indice relie un personnage à une action.","Construis : « La fille qui chante est mon amie. »",["The","girl","who","sings","is","my","friend","."],["girl","who","sings","The","my","is",".","friend","which"],"Who introduit une relative qui caractérise une personne.","🗝️ La clé dorée apparaît !"],["Le château est sauvé grâce à une cause.","Construis : « Nous sommes restés parce qu’il pleuvait. »",["We","stayed","because","it","was","raining","."],["because","raining","We","was","stayed",".","it","so"],"Because introduit une cause et relie deux propositions.","🏰 La dernière tour se rallume !"]]},{"id":"garden","icon":"🔮","title":"Le Jardin des Possibles","world":"modal","min":"5e","subtitle":"Choisis une intention, observe les conséquences.","kind":"choice","scenes":[["Un ami est capable de traverser le pont.","Exprime sa capacité.",["He must cross the bridge.","He can cross the bridge.","He might cross the bridge."],1,"Can exprime ici la capacité, pas l’obligation ou l’incertitude.","🌉 Le pont brille : le passage est possible !"],["Un panneau interdit de cueillir les fleurs.","Exprime une interdiction.",["You mustn’t pick the flowers.","You don’t have to pick the flowers.","You should pick the flowers."],0,"Mustn’t = interdiction ; don’t have to = absence d’obligation.","🌷 Les fleurs sont protégées !"],["Le ciel est sombre, mais la pluie reste incertaine.","Exprime une possibilité.",["It must rain.","It might rain.","It can’t rain."],1,"Might exprime une possibilité sans certitude.","☁️ Un nuage apparaît, mais rien n’est certain !"],["Une amie a mal à la tête. Tu lui proposes un conseil.","Choisis un conseil, pas un ordre.",["You must stay home.","You should rest.","You can’t rest."],1,"Should exprime un conseil.","💚 Ton amie peut choisir de se reposer !"]]}],"img":{"starter":"data:image/webp;base64,UklGRvYrAABXRUJQVlA4IOorAAAwoACdASrcANwAPnUyk0YkoyGhMPR9uJAOiWoAs7om/sHMEbd9z/h/3B9k/jfrw9d/gv8b/yfZv189q+XV0V5uf+d60f1f7Cf7CdO7zS/uR6m3p7/pvqRfzPqr/SU82v1mP3V9NLBnuSn6fwl8onuv3M/xHuGZQ+yrUm+efhb9x/i/aj/a+C/y71DvzH+m/6fgQ+A/4foF+9P37/veLHq4+LfYD/Wn1B8I6gJ4xWmr6/9hT9iv+6j9HrOnjGM2w5KPFIfu4Gv5Mu0W8UdMvgFXVkLO9BcBWE4v2DNcJgCoe2MynZ8MgAhAnPfesyZPz0z/K0URcPMYalqN55aKQNFbFoZrX3QHYAuK+qNTLKZguAPEn7U/wHQ5m4zFJYO7RzC5lgXUJS8CLewf/7FKkLFXD8GBWqpnF5Tbtuj1zm+0yNra4CQlmxyXMBwII6ufniJz5qCEQhdE3I8xaOIcq/YP/6dOUNU03V4hb/dv2ZvmJ0HBPsBjmFgdb+buq7P0dXKXBHdB9CiY9mJbIWSmv1GgcS0qpx+XYdL97gfXzVwKLBOHtnPUgtNcLX7tehLtDnfc4Cvjo9tven6daLZMClnjauJKm1biFZR1ye4+9xKusFInQteUmV/iJmq7ucFoXU1swgzxVDusrd3px6w1ZawE2FXEYzsIHPI2HMAD5Uf0vB2V7UOwupZMox0m3qane5cocOX4t11411VppnXx/hz9MOvATYHnp6tS6CNkZE4ZJ34a2roxgexruH6fRp7ok+DJmOpnE4TtL3Wj6lwhXp9DIZH3OGJxrzCGg92YfVtsyYjdsvt5AxyV8vvIQxWA0GVybW81aIXlvf3Fafq0ejuMIC6Wz+hJ5K3pQCBjtchSGgKvDGQmwlVyGOHVG4vYZ6jTl43P+nDEcZz34CAU29AKXo7ok3zT8Yan8Hu5ZVFGu6L9NQ3+X25rQ033R/KiXedni37dwuw4pQlgBCuuM84DyblWU+fGYl7zeSAYdu14+a+prDn+Ur+rngsGGT7w67GMtUE7GOYlPgVN5yxDuKkuUjSBmm8m+0CeuRL6u3SM8KgWICq+Lq9OlYVhp63lM8pEG2vhVF9cSFVZTEY7 <script>
(function () {
'use strict';

/* ============ Données ============ */
var D = JSON.parse(document.getElementById('gl-data').textContent);
var W = {}, M = {};
D.worlds.forEach(function (w, i) { w.n = i; W[w.id] = w; });
D.missions.forEach(function (m, i) { m.n = i; M[m.id] = m; });
var GRADES = D.grades;
var STORE = 'grammarland-v6';
var DAY = 86400000;
var BOXES = [1, 2, 4, 8, 16, 32];
var KIND = {
  observe: { icon: '🔍', label: 'J’observe' },
  build:   { icon: '🧱', label: 'Je construis' },
  sort:    { icon: '🗂️', label: 'Je classe' },
  use:     { icon: '🎯', label: 'J’utilise' },
  listen:  { icon: '🎧', label: 'J’écoute' },
  repair:  { icon: '🛠️', label: 'Je répare' }
};
var RANKS = [
  [0, 'Moussaillon', '⛵'], [300, 'Explorateur·rice', '🧭'], [800, 'Navigateur·rice', '🗺️'],
  [1600, 'Capitaine', '⚓'], [3000, 'Amiral·e', '🏴'], [5000, 'Légende de Grammarland', '🌟']
];
var STATUS = {
  L: { short: 'Listé au BO', long: 'Repère grammatical listé dans le programme de ce niveau (ou d’un niveau antérieur, en reprise spiralaire).' },
  E: { short: 'Exemple du BO', long: 'Structure présente dans les exemples d’actes langagiers du programme de ce niveau.' },
  S: { short: 'Progression', long: 'Choix de progression spiralaire proposé par GRAMMARLAND, à ajuster à ta progression.' }
};

/* ============ Utilitaires ============ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function gnum(g) { return GRADES.indexOf(g); }
function shuffle(a) {
  var r = a.slice(), i, j, t;
  for (i = r.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function range(n) { var r = [], i; for (i = 0; i < n; i++) r.push(i); return r; }
function extend(a, b) { var k; for (k in b) if (Object.prototype.hasOwnProperty.call(b, k)) a[k] = b[k]; return a; }
function dayKey(t) { var d = new Date(t || Date.now()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function fmtDate(t) {
  var d = new Date(t), m = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  return d.getDate() + ' ' + m[d.getMonth()];
}
function $(id) { return document.getElementById(id); }
function closest(el, sel) {
  while (el && el.nodeType === 1) {
    if (el.matches ? el.matches(sel) : el.msMatchesSelector(sel)) return el;
    el = el.parentNode;
  }
  return null;
}
function plural(n, s, p) { return n + ' ' + (n > 1 ? (p || s + 's') : s); }

/* ============ Sauvegarde ============ */
function defaults() {
  return {
    v: 6, grade: '6e', xp: 0, prog: {}, boss: {}, adv: {}, wins: 0, reviews: 0, perfect: 0, sessions: 0,
    streak: { last: '', count: 0 }, welcome: false,
    settings: { audio: true, voice: 'en-GB', slow: false, dys: false, large: false, contrast: false, calm: false, guided: false }
  };
}
function load() {
  try {
    var raw = localStorage.getItem(STORE);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.v === 6) {
        var d = defaults();
        s.settings = extend(d.settings, s.settings || {});
        return extend(d, s);
      }
    }
  } catch (e) { /* stockage indisponible */ }
  return defaults();
}
var S = load();
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); }
  catch (e) { toast('Le navigateur bloque la sauvegarde locale : tes progrès ne seront pas conservés après fermeture.'); }
}

/* ============ Logique de progression ============ */
function eligible(m) { return gnum(m.grade) <= gnum(S.grade); }
function prog(id) { return S.prog[id] || null; }
function isDone(id) { var p = prog(id); return !!(p && p.done); }
function stars(id) { var p = prog(id); return p ? (p.stars || 0) : 0; }
function isDue(id) { var p = prog(id); return !!(p && p.done && (p.due || 0) <= Date.now()); }
function worldMissions(wid, all) {
  return D.missions.filter(function (m) { return m.world === wid && (all || eligible(m)); });
}
function locked(m) {
  if (!S.settings.guided) return false;
  var list = D.missions.filter(function (x) { return x.world === m.world && x.grade === m.grade; });
  var i = list.indexOf(m), j;
  for (j = 0; j < i; j++) if (!isDone(list[j].id)) return true;
  return false;
}
function bossKey(wid) { return wid + '@' + S.grade; }
function bossState(wid) {
  var list = worldMissions(wid);
  var done = list.filter(function (m) { return isDone(m.id); }).length;
  var need = Math.max(2, Math.ceil(list.length * 0.6));
  return { won: !!S.boss[bossKey(wid)], open: done >= need, done: done, need: need, total: list.length };
}
function dueList() {
  return D.missions.filter(function (m) { return eligible(m) && isDue(m.id); });
}
function nextMission() {
  var order = D.worlds.map(function (w) { return w.id; }), i, list;
  var cur = D.missions.filter(function (m) { return m.grade === S.grade && !isDone(m.id) && !locked(m); });
  if (cur.length) {
    cur.sort(function (a, b) { return order.indexOf(a.world) - order.indexOf(b.world) || a.n - b.n; });
    return cur[0];
  }
  list = D.missions.filter(function (m) { return eligible(m) && !isDone(m.id) && !locked(m); });
  if (list.length) return list[0];
  list = D.missions.filter(eligible).sort(function (a, b) { return stars(a.id) - stars(b.id); });
  for (i = 0; i < list.length; i++) if (stars(list[i].id) < 3) return list[i];
  return null;
}
function rank(xp) {
  var r = RANKS[0], i;
  for (i = 0; i < RANKS.length; i++) if (xp >= RANKS[i][0]) r = RANKS[i];
  var nx = null;
  for (i = 0; i < RANKS.length; i++) if (RANKS[i][0] > xp) { nx = RANKS[i]; break; }
  return { name: r[1], icon: r[2], from: r[0], next: nx };
}
function totals() {
  var el = D.missions.filter(eligible);
  var done = el.filter(function (m) { return isDone(m.id); });
  var st = 0;
  done.forEach(function (m) { st += stars(m.id); });
  return { total: el.length, done: done.length, stars: st, due: dueList().length };
}
function bumpStreak() {
  var t = dayKey(), y = dayKey(Date.now() - DAY);
  if (S.streak.last === t) return;
  S.streak.count = (S.streak.last === y) ? S.streak.count + 1 : 1;
  S.streak.last = t;
}

/* ============ Synthèse vocale ============ */
var TTS = ('speechSynthesis' in window) && typeof window.SpeechSynthesisUtterance === 'function';
function speak(text, slow) {
  if (!TTS) { toast('La lecture audio n’est pas disponible dans ce navigateur.'); return; }
  if (!S.settings.audio) { toast('Active la voix anglaise dans les réglages ⚙️.'); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g, ' blank '));
    u.lang = S.settings.voice;
    u.rate = (slow || S.settings.slow) ? 0.68 : 0.9;
    var vs = window.speechSynthesis.getVoices(), v = null, i;
    for (i = 0; i < vs.length; i++) if (vs[i].lang && vs[i].lang.replace('_', '-') === S.settings.voice) { v = vs[i]; break; }
    if (!v) for (i = 0; i < vs.length; i++) if (vs[i].lang && vs[i].lang.indexOf('en') === 0) { v = vs[i]; break; }
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) { toast('Impossible de lancer la lecture audio ici.'); }
}
if (TTS) { try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = function () {}; } catch (e) {} }
function sayBtn(text, label) {
  return '<button class="say" data-act="say" data-text="' + esc(text) + '" aria-label="' + esc(label || 'Écouter la phrase') + '" title="Écouter">🔊</button>';
}

/* ============ Toast, modale, effets ============ */
var toastT = null;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg; t.className = 'toast show';
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.className = 'toast'; }, 3200);
}
function openModal(html, label) {
  var m = $('modal');
  m.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" aria-label="' + esc(label || 'Fenêtre') + '">' + html + '</div>';
  m.hidden = false;
  var f = m.querySelector('button, select, input');
  if (f) f.focus();
}
function closeModal() { var m = $('modal'); m.hidden = true; m.innerHTML = ''; }
function confirmBox(text, okLabel, onOk) {
  confirmCb = onOk;
  openModal('<h2 class="h2">Vérification</h2><p>' + esc(text) + '</p><div class="row end"><button class="btn ghost" data-act="modal-close">Annuler</button><button class="btn danger" data-act="confirm-ok">' + esc(okLabel) + '</button></div>', 'Confirmation');
}
var confirmCb = null;
function burst() {
  if (S.settings.calm) return;
  var fx = $('fx'), html = '', i, cols = ['#ffd23f', '#ff5a4f', '#3ddc97', '#3d8bff', '#b65cff', '#ff4f9a'];
  for (i = 0; i < 36; i++) {

      var nr = mkRound(k, M[r.mid]); nr.retry = true;
      G.rounds.push(nr); r.spawned = true;
    }
  }
  G.results.push({ mid: r.mid, ok: ok });
  if (G.type === 'review') reviewUpdate(r.mid, ok);
  persist();
  renderMain();
  var fb = document.querySelector('.feedback');
  if (fb) fb.focus();
}
function tileByK(r, k) { var i; for (i = 0; i < r.tiles.length; i++) if (r.tiles[i].k === k) return r.tiles[i]; return null; }
function reviewUpdate(mid, ok) {
  var p = S.prog[mid] || { done: true, stars: 1, box: 0 };
  p.box = ok ? Math.min((p.box || 0) + 1, BOXES.length - 1) : 0;
  p.due = Date.now() + BOXES[p.box] * DAY;
  S.prog[mid] = p;
}
function nextRound() {
  if (!G) return;
  if (G.i < G.rounds.length - 1) { G.i++; prepRound(); renderMain(); focusRound(); }
  else finish();
}
function focusRound() { var h = document.querySelector('.round h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } }
function finish() {
  var g = G, res = { type: g.type, correct: g.correct, total: g.results.length, errors: g.errors, xp: g.xp, meta: g.meta, bonus: 0 };
  if (g.type === 'lesson') {
    var id = g.meta.mid, old = S.prog[id], first = !(old && old.done);
    var st = g.errors === 0 ? 3 : g.errors <= 2 ? 2 : 1;
    var box = first ? 1 : Math.max(old.box || 0, g.errors === 0 ? Math.min((old.box || 0) + 1, BOXES.length - 1) : 1);
    S.prog[id] = { done: true, stars: Math.max(st, old ? old.stars || 0 : 0), box: box, due: Date.now() + BOXES[box] * DAY, plays: ((old && old.plays) || 0) + 1, last: Date.now() };
    res.bonus = first ? 50 : 10; res.stars = st; res.first = first;
    if (st === 3) S.perfect++;
  } else if (g.type === 'boss') {
    res.won = g.errors <= 2;
    if (res.won) { var bk = bossKey(g.meta.wid); res.firstWin = !S.boss[bk]; S.boss[bk] = true; res.bonus = res.firstWin ? 100 : 20; }
  } else if (g.type === 'review') {
    S.reviews++; res.bonus = 15;
  } else { res.bonus = 0; }
  S.xp += g.xp + res.bonus; S.sessions++;
  bumpStreak(); persist();
  LAST = res; G = null;
  go('fin');
  if ((res.type === 'lesson' && res.stars === 3) || res.won) burst();
}

/* ============ Rendu d'une manche ============ */
function optionsHTML(r, opts) {
  return '<div class="opts" role="group" aria-label="Réponses possibles">' + r.order.map(function (oi) {
    var cls = 'opt';
    if (r.sel === oi) cls += ' picked';
    if (r.solved && oi === 0) cls += ' right';
    if (r.solved && r.sel === oi && oi !== 0) cls += ' wrong';
    return '<button class="' + cls + '" data-act="pick" data-i="' + oi + '"' + (r.solved ? ' disabled' : '') + ' aria-pressed="' + (r.sel === oi) + '">' + esc(opts[oi]) + '</button>';
  }).join('') + '</div>';
}
function gapHTML(q) { return esc(q).replace(/___/g, '<span class="gap">_____</span>'); }
function roundBody(r) {
  var it = item(r), m = M[r.mid];
  if (r.kind === 'observe') {
    return '<p class="scene">' + esc(it.s) + '</p>' +
      '<div class="pair"><div class="sent"><b>A</b><span lang="en">' + esc(it.a) + '</span>' + sayBtn(it.a) + '</div>' +
      '<div class="sent"><b>B</b><span lang="en">' + esc(it.b) + '</span>' + sayBtn(it.b) + '</div></div>' +
      '<p class="q">' + esc(it.q) + '</p>' + optionsHTML(r, it.o);
  }
  if (r.kind === 'use') {
    return '<p class="scene">' + esc(it.s) + '</p><p class="q big" lang="en">' + gapHTML(it.q) + '</p>' + optionsHTML(r, it.o);
  }
  if (r.kind === 'repair') {
    return '<p class="scene">Cette phrase contient une erreur. Choisis la bonne version.</p>' +
      '<p class="broken" lang="en">' + esc(it.x) + '</p>' + optionsHTML(r, it.o);
  }
  if (r.kind === 'build' || r.kind === 'listen') {
    var listen = r.kind === 'listen';
    var top = listen ?
      '<p class="scene">Écoute la phrase, puis reconstruis-la.</p><div class="row"><button class="btn" data-act="listen">🔊 Écouter</button><button class="btn ghost" data-act="listen-slow">🐢 Plus lentement</button></div>' :
      '<p class="scene">' + esc(it.s) + '</p><p class="q">Remets les mots dans l’ordre. Attention : certains mots sont en trop.</p>';
    var placed = '<div class="line" aria-label="Ta phrase" lang="en">' + (r.placed.length ? r.placed.map(function (k, pos) {
      return '<button class="tile placed" data-act="unplace" data-pos="' + pos + '"' + (r.solved ? ' disabled' : '') + '>' + esc(tileByK(r, k).w) + '</button>';
    }).join('') : '<span class="ph">Touche les mots pour construire la phrase…</span>') + '</div>';
    var bank = '<div class="bank" lang="en">' + r.tiles.map(function (t) {
      var used = r.placed.indexOf(t.k) >= 0;
      return '<button class="tile" data-act="place" data-k="' + t.k + '"' + (used || r.solved ? ' disabled' : '') + (used ? ' aria-hidden="true"' : '') + '>' + esc(t.w) + '</button>';
    }).join('') + '</div>';
    return top + placed + bank + (r.solved ? '' : '<div class="row"><button class="btn ghost small" data-act="clear">↺ Tout reprendre</button></div>');
  }
  if (r.kind === 'sort') {
    var bins = [0, 1].map(function (g) {
      var inside = r.cards.map(function (c, i) { return { c: c, i: i }; }).filter(function (o) { return r.assign[o.i] === g; });
      return '<div class="bin bin' + g + '"><h3>' + esc(it.g[g]) + '</h3><div class="bin-in" lang="en">' + (inside.length ? inside.map(function (o) {
        var cls = 'card-s placed' + (r.solved ? (o.c.g === g ? ' right' : ' wrong') : '');
        return '<button class="' + cls + '" data-act="unsort" data-i="' + o.i + '"' + (r.solved ? ' disabled' : '') + '>' + esc(o.c.t) + '</button>';
      }).join('') : '<span class="ph">Vide</span>') + '</div></div>';
    }).join('');
    var free = r.cards.map(function (c, i) { return { c: c, i: i }; }).filter(function (o) { return r.assign[o.i] === undefined; });
    var deck = free.length ? '<div class="deck" lang="en">' + free.map(function (o) {
      return '<div class="card-s free"><span>' + esc(o.c.t) + '</span><div class="sendto">' +
        '<button class="mini b0" data-act="sort" data-i="' + o.i + '" data-g="0" aria-label="Ranger « ' + esc(o.c.t) + ' » dans : ' + esc(it.g[0]) + '">◀ ' + esc(shortLabel(it.g[0])) + '</button>' +
        '<button class="mini b1" data-act="sort" data-i="' + o.i + '" data-g="1" aria-label="Ranger « ' + esc(o.c.t) + ' » dans : ' + esc(it.g[1]) + '">' + esc(shortLabel(it.g[1])) + ' ▶</button></div></div>';
    }).join('') + '</div>' : '';

  }
  return '';
}
function shortLabel(s) { var t = s.split(' (')[0]; return t.length > 22 ? t.slice(0, 20) + '…' : t; }

    '<h2 class="h2">Les ' + ms.length + ' missions de ' + g + '</h2>' +
    '<p class="small">Statut de l’ancrage : <span class="st st-L">L</span> ' + STATUS.L.short + ' (' + cnt.L + ') · <span class="st st-E">E</span> ' + STATUS.E.short + ' (' + cnt.E + ') · <span class="st st-S">S</span> ' + STATUS.S.short + ' (' + cnt.S + ')</p>' +
    '<ul class="list">' + ms.map(function (m) { return '<li style="--wc:' + W[m.world].color + '"><span><span class="st st-' + m.st + '">' + m.st + '</span>' + esc(m.title) + '</span><small>' + esc(m.bo) + '</small></li>'; }).join('') + '</ul>' +
    '<div class="card legend"><h2 class="h2">Comment lire les statuts</h2><p><span class="st st-L">L</span> ' + esc(STATUS.L.long) + '</p><p><span class="st st-E">E</span> ' + esc(STATUS.E.long) + '</p><p><span class="st st-S">S</span> ' + esc(STATUS.S.long) + '</p>' +
    '<p class="small">Textes officiels : <a href="https://www.education.gouv.fr/bo/2025/Hebdo22/MENE2504621A" target="_blank" rel="noopener">BO n°22 du 29 mai 2025</a> · <a href="https://eduscol.education.gouv.fr/4758/ressources-d-accompagnement-pour-les-langues-vivantes-etrangeres-et-regionales-au-college" target="_blank" rel="noopener">Ressources Éduscol</a>. Les listes du programme sont indicatives : chaque professeur garde la main sur sa progression.</p></div>' +
    '</section>';
}

/* ============ Progrès et badges ============ */
function badges() {
  var t = D.missions.filter(function (m) { return isDone(m.id); }).length;
  var bossN = Object.keys(S.boss).length, adv = Object.keys(S.adv).length;
  var gradeAll = D.missions.filter(function (m) { return m.grade === S.grade; });
  var gradeDone = gradeAll.every(function (m) { return isDone(m.id); });
  return [
    ['🥇', 'Première mission', t >= 1], ['🧭', '10 missions', t >= 10], ['🗺️', '25 missions', t >= 25], ['🌍', '50 missions', t >= 50],
    ['🎓', 'Toute ma classe', gradeDone], ['🐉', 'Premier gardien', bossN >= 1], ['👑', '4 couronnes', bossN >= 4], ['🏰', '8 couronnes', bossN >= 8],
    ['🎯', '100 bonnes réponses', S.wins >= 100], ['💯', '500 bonnes réponses', S.wins >= 500], ['🔁', '10 révisions', S.reviews >= 10],
    ['🔥', '3 jours d’affilée', S.streak.count >= 3], ['⚡', '7 jours d’affilée', S.streak.count >= 7], ['✨', '3 aventures', adv >= 3], ['🏆', '10 missions parfaites', S.perfect >= 10]
  ];
}
function pageProgress() {
  var t = totals(), r = rank(S.xp), b = badges();
  var pct = r.next ? Math.round(100 * (S.xp - r.from) / (r.next[0] - r.from)) : 100;
  return '<section><h1 class="title">Mes progrès</h1>' +
    '<div class="card rankcard"><div class="rank-i" aria-hidden="true">' + r.icon + '</div><div><p class="kicker">Rang</p><h2 class="h2">' + esc(r.name) + '</h2>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div><p class="small">' + S.xp + ' XP' + (r.next ? ' · encore ' + (r.next[0] - S.xp) + ' XP pour devenir ' + esc(r.next[1]) : ' · rang maximal atteint') + '</p></div></div>' +
    '<div class="stats"><div class="card"><b>' + t.done + '/' + t.total + '</b><span>missions jusqu’en ' + S.grade + '</span></div><div class="card"><b>' + t.stars + '</b><span>étoiles</span></div>' +
    '<div class="card"><b>' + Object.keys(S.boss).length + '</b><span>couronnes</span></div><div class="card"><b>' + S.streak.count + '</b><span>jour' + (S.streak.count > 1 ? 's' : '') + ' d’affilée</span></div></div>' +
    '<h2 class="h2">Mes îles</h2><div class="wbars">' + D.worlds.map(function (w) {
      var l = worldMissions(w.id), d = l.filter(function (m) { return isDone(m.id); }).length;
      return '<button class="wbar" data-act="world" data-id="' + w.id + '" style="--wc:' + w.color + '"><span>' + esc(w.name) + (S.boss[bossKey(w.id)] ? ' 👑' : '') + '</span><span class="bar"><i style="width:' + (l.length ? Math.round(100 * d / l.length) : 0) + '%"></i></span><small>' + d + '/' + l.length + '</small></button>';
    }).join('') + '</div>' +
    '<h2 class="h2">Badges</h2><div class="badges">' + b.map(function (x) { return '<div class="bdg' + (x[2] ? ' on' : '') + '"><span aria-hidden="true">' + x[0] + '</span>' + esc(x[1]) + (x[2] ? '' : '<small>à gagner</small>') + '</div>'; }).join('') + '</div>' +
    '<h2 class="h2">Ma sauvegarde</h2><div class="card"><p class="small">Tes progrès sont enregistrés dans ce navigateur. Exporte-les pour les garder ou changer d’appareil.</p>' +
    '<div class="row wrap"><button class="btn ghost" data-act="export">⬇️ Exporter mes progrès</button><label class="btn ghost filebtn">⬆️ Importer<input id="importer" type="file" accept="application/json,.json"></label><button class="btn ghost danger-t" data-act="reset">Tout effacer</button></div></div>' +
    '</section>';
}
function exportSave() {
  try {
    var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'grammarland-progres-' + dayKey() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 500);
    toast('Fichier de sauvegarde téléchargé.');
  } catch (e) { toast('Export impossible dans ce navigateur.'); }
}
function importSave(file) {
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var s = JSON.parse(rd.result);
      if (!s || s.v !== 6) throw new Error('version');
      var d = defaults(); s.settings = extend(d.settings, s.settings || {});
      S = extend(d, s); persist(); applySettings(); render(); toast('Progrès importés.');
    } catch (e) { toast('Ce fichier n’est pas une sauvegarde GRAMMARLAND V6.'); }
  };
  rd.readAsText(file);
}

/* ============ Aventures ============ */
var ADV = null;
function pageAdventures() {
  return '<section><h1 class="title">Aventures</h1><p class="lead">Trois histoires courtes où chaque bonne réponse transforme la scène. Sans chrono, avec des indices.</p><div class="advgrid">' +
    D.adventures.map(function (a) {
      var done = !!S.adv[a.id];
      return '<article class="adv card" style="--wc:' + W[a.world].color + '"><img src="' + D.img[a.world] + '" alt="" width="110" height="110"><div><span class="tag">' + a.icon + ' dès la ' + a.min + '</span><h2 class="h2">' + esc(a.title) + '</h2><p>' + esc(a.subtitle) + '</p><p class="small">4 scènes · ' + (done ? '🏅 terminée' : 'à découvrir') + '</p>' +
        '<button class="btn small" data-act="adv" data-id="' + a.id + '">' + (done ? 'Rejouer' : 'Commencer') + '</button></div></article>';
    }).join('') + '</div></section>';
}
function advFind(id) { var i; for (i = 0; i < D.adventures.length; i++) if (D.adventures[i].id === id) return D.adventures[i]; return null; }
function startAdv(id) { ADV = { id: id, i: 0, sel: [], solved: false, fb: '', ok: false, err: 0 }; if (location.hash === '#aventure/' + id) { parseHash(); render(); } else go('aventure', id); }
function pageAdventure() {
  var a = advFind(ADV.id), sc = a.scenes[ADV.i], build = a.kind === 'build', choices;
  if (build) {
    var tiles = sc[3];
    choices = '<div class="line" lang="en">' + (ADV.sel.length ? ADV.sel.map(function (k, pos) { return '<button class="tile placed" data-act="adv-unplace" data-pos="' + pos + '"' + (ADV.solved ? ' disabled' : '') + '>' + esc(tiles[k]) + '</button>'; }).join('') : '<span class="ph">Touche les mots…</span>') + '</div>' +
      '<div class="bank" lang="en">' + tiles.map(function (t, k) { return '<button class="tile" data-act="adv-place" data-k="' + k + '"' + (ADV.sel.indexOf(k) >= 0 || ADV.solved ? ' disabled' : '') + '>' + esc(t) + '</button>'; }).join('') + '</div>';
  } else {
    choices = '<div class="opts">' + sc[2].map(function (o, k) {
      var cls = 'opt' + (ADV.sel[0] === k ? ' picked' : '') + (ADV.solved && k === sc[3] ? ' right' : '');
      return '<button class="' + cls + '" data-act="adv-pick" data-k="' + k + '"' + (ADV.solved ? ' disabled' : '') + ' lang="en">' + esc(o) + '</button>';
    }).join('') + '</div>';
  }
  return '<section class="play" style="--wc:' + W[a.world].color + '"><div class="play-top"><button class="linkbtn" data-act="nav" data-p="aventures">← Aventures</button><span class="play-title">' + a.icon + ' ' + esc(a.title) + '</span><span class="pill">Scène ' + (ADV.i + 1) + ' / 4</span></div>' +
    '<div class="adv-stage card"><div class="adv-scene' + (ADV.solved ? ' lit' : '') + '" style="background-image:url(' + D.img[a.world] + ')"><p>' + (ADV.solved ? esc(sc[5]) : '✨ Transforme cette scène avec la bonne phrase.') + '</p></div>' +
    '<div class="adv-work"><h2 class="h2">' + esc(sc[0]) + '</h2><p class="q">' + esc(sc[1]) + '</p>' + choices +
    (ADV.fb ? '<div class="feedback ' + (ADV.ok ? 'ok' : 'ko') + '" role="status"><p>' + esc(ADV.fb) + '</p></div>' : '') +
    '<div class="row end"><button class="btn ghost" data-act="adv-hint">💡 Indice</button>' + (build && !ADV.solved ? '<button class="btn ghost" data-act="adv-clear">↺</button>' : '') +
    (ADV.solved ? '<button class="btn go" data-act="adv-next">' + (ADV.i === 3 ? '🏆 Terminer' : 'Scène suivante') + '</button>' : '<button class="btn" data-act="adv-check">Tester</button>') + '</div></div></div></section>';
}
function advAction(act, el) {
  var a = advFind(ADV.id), sc = a.scenes[ADV.i], build = a.kind === 'build';
  if (act === 'adv-hint') { ADV.fb = build ? 'Commence par le sujet, puis le verbe, puis les compléments.' : sc[4]; ADV.ok = false; }
  if (act === 'adv-pick' && !ADV.solved) { ADV.sel = [+el.getAttribute('data-k')]; ADV.fb = ''; }
  if (act === 'adv-place' && !ADV.solved) { ADV.sel.push(+el.getAttribute('data-k')); ADV.fb = ''; }
  if (act === 'adv-unplace' && !ADV.solved) { ADV.sel.splice(+el.getAttribute('data-pos'), 1); }
  if (act === 'adv-clear') { ADV.sel = []; }
  if (act === 'adv-check') {
    if (!ADV.sel.length) { toast('Fais un choix avant de tester.'); return; }
    var ok = build ? (ADV.sel.map(function (k) { return sc[3][k]; }).join(' ') === sc[2].join(' ')) : ADV.sel[0] === sc[3];
    if (ok) { ADV.solved = true; ADV.ok = true; ADV.fb = sc[4]; }
    else { ADV.err++; ADV.ok = false; ADV.fb = 'Pas encore : relis la situation et essaie une autre formulation. Tu peux demander un indice.'; }
  }
  if (act === 'adv-next') {
    if (ADV.i === 3) {
      var first = !S.adv[a.id]; S.adv[a.id] = true;
      if (first) S.xp += 40;
      persist(); burst(); toast(first ? '🏆 Aventure terminée : +40 XP !' : '🏆 Aventure terminée !');
      ADV = null; go('aventures'); return;
    }
    ADV.i++; ADV.sel = []; ADV.solved = false; ADV.fb = ''; ADV.ok = false;
  }
  renderMain();
}

/* ============ Réglages ============ */
function showSettings() {
  var st = S.settings;
  function tg(k, label, help) {
    return '<label class="toggle"><input type="checkbox" data-set="' + k + '"' + (st[k] ? ' checked' : '') + '><span><strong>' + label + '</strong><small>' + help + '</small></span></label>';
  }
  openModal('<div class="row between"><h2 class="h2">Réglages</h2><button class="iconbtn" data-act="modal-close" aria-label="Fermer">✕</button></div>' +
    '<p class="kicker">Ma classe</p><div class="grades">' + GRADES.map(function (g) { return '<button class="gchip' + (g === S.grade ? ' on' : '') + '" data-act="grade" data-g="' + g + '">' + g + '</button>'; }).join('') + '</div>' +
    '<p class="kicker">Voix anglaise</p>' + tg('audio', 'Lecture audio', 'Les phrases peuvent être lues à voix haute.') +
    '<label class="field">Accent <select data-set="voice">' + [['en-GB', 'Britannique'], ['en-US', 'Américain'], ['en-IE', 'Irlandais'], ['en-AU', 'Australien']].map(function (v) {
      return '<option value="' + v[0] + '"' + (st.voice === v[0] ? ' selected' : '') + '>' + v[1] + '</option>'; }).join('') + '</select></label>' +
    tg('slow', 'Voix lente', 'Pour mieux distinguer chaque mot.') +
    '<button class="btn small ghost" data-act="say" data-text="Welcome to Grammarland! Let’s play with English grammar.">🔊 Tester la voix</button>' +
    '<p class="kicker">Confort de lecture</p>' + tg('dys', 'Mode lecture facilitée', 'Police Lexend, espacements augmentés.') + tg('large', 'Grands caractères', 'Texte agrandi partout.') +
    tg('contrast', 'Contraste renforcé', 'Couleurs plus marquées, fonds unis.') + tg('calm', 'Animations réduites', 'Supprime les confettis et les mouvements.') +
    '<p class="kicker">Parcours</p>' + tg('guided', 'Mode guidé', 'Dans chaque île, les missions de ta classe se débloquent dans l’ordre.') +
    '<div class="row end"><button class="btn" data-act="modal-close">Fermer</button></div>', 'Réglages');
}

/* ============ Rendu ============ */
function renderMain() {
  var h = '';
  if (page === 'carte') h = pageMap();
  else if (page === 'monde') h = pageWorld();
  else if (page === 'mission') h = pageMission();
  else if (page === 'jouer') h = pagePlay();
  else if (page === 'fin') h = pageEnd();
  else if (page === 'jeux') h = pageArcade();
  else if (page === 'revisions') h = pageReview();
  else if (page === 'carnet') h = pageNotebook();
  else if (page === 'programme') h = pageProgramme();
  else if (page === 'progres') h = pageProgress();
  else if (page === 'aventures') h = pageAdventures();
  else if (page === 'aventure') h = pageAdventure();
  $('main').innerHTML = h;
  document.body.setAttribute('data-page', page);
}
function render() { renderChrome(); renderMain(); }

/* ============ Événements ============ */
document.addEventListener('click', function (e) {
  var el = closest(e.target, '[data-act]');
  if (!el || el.disabled) return;
  var act = el.getAttribute('data-act'), r = cur();
  if (act.indexOf('adv-') === 0) { advAction(act, el); return; }
  switch (act) {
    case 'nav': if (G && page === 'jouer') { G = null; } go(el.getAttribute('data-p')); break;
    case 'world': go('monde', el.getAttribute('data-id')); break;
    case 'mission': go('mission', el.getAttribute('data-id')); break;
    case 'start': startLesson(el.getAttribute('data-id')); break;
    case 'boss': startBoss(el.getAttribute('data-id')); break;
    case 'review': startReview(); break;
    case 'arcade': startArcade(el.getAttribute('data-mode'), el.getAttribute('data-w') || ''); break;
    case 'arcade-w': arcadeWorld = el.getAttribute('data-w'); renderMain(); break;
    case 'adv': startAdv(el.getAttribute('data-id')); break;
    case 'grade':
      S.grade = el.getAttribute('data-g'); persist();
      if (!$('modal').hidden) showSettings();
      render(); toast('Classe : ' + S.grade); break;
    case 'settings': showSettings(); break;
    case 'modal-close': closeModal(); break;
    case 'confirm-ok': closeModal(); if (confirmCb) confirmCb(); confirmCb = null; break;
    case 'welcome-ok': S.welcome = true; persist(); renderMain(); break;
    case 'say': speak(el.getAttribute('data-text')); break;
    case 'pick': if (r && !r.solved) { r.sel = +el.getAttribute('data-i'); renderMain(); } break;
    case 'place': if (r && !r.solved) { r.placed.push(+el.getAttribute('data-k')); renderMain(); } break;
    case 'unplace': if (r && !r.solved) { r.placed.splice(+el.getAttribute('data-pos'), 1); renderMain(); } break;
    case 'clear': if (r && !r.solved) { r.placed = []; renderMain(); } break;
    case 'sort': if (r && !r.solved) { r.assign[+el.getAttribute('data-i')] = +el.getAttribute('data-g'); renderMain(); } break;
    case 'unsort': if (r && !r.solved) { delete r.assign[+el.getAttribute('data-i')]; renderMain(); } break;
    case 'listen': speak(answerText(r)); break;
    case 'listen-slow': speak(answerText(r), true); break;
    case 'hint': if (r) { r.hint = true; G.hints++; renderMain(); } break;
    case 'check': check(); break;
    case 'next': nextRound(); break;
    case 'quit':
      confirmBox('Quitter la partie ? Ta progression dans cette partie sera perdue.', 'Quitter', function () { var back = G && G.type === 'lesson' ? ['monde', M[G.meta.mid].world] : ['carte']; G = null; go(back[0], back[1]); });
      break;
    case 'nb-g': NB.g = el.getAttribute('data-g'); renderMain(); break;
    case 'nb-w': NB.w = el.getAttribute('data-w'); renderMain(); break;
    case 'pg': PG = el.getAttribute('data-g'); renderMain(); break;
    case 'export': exportSave(); break;
    case 'reset': confirmBox('Effacer définitivement tous tes progrès sur cet appareil ?', 'Tout effacer', function () { var keep = S.settings; S = defaults(); S.settings = keep; persist(); render(); toast('Progrès effacés.'); }); break;
  }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.tagName !== 'BUTTON') {
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
  if (e.key === 'Escape' && !$('modal').hidden) closeModal();
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'nbq') { NB.q = e.target.value; var l = $('nblist'); if (l) l.innerHTML = nbList(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute('data-set')) {
    var k = t.getAttribute('data-set');
    S.settings[k] = (t.type === 'checkbox') ? t.checked : t.value;
    persist(); applySettings();
    if (k === 'guided') render();
  }
  if (t && t.id === 'importer' && t.files && t.files[0]) importSave(t.files[0]);
});
$('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

/* ============ Démarrage ============ */
applySettings();
parseHash();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
window.GRAMMARLAND = { data: D, state: function () { return S; }, game: function () { return G; }, item: function (r) { return item(r); } };
})();

</script>
</body>
</html>
